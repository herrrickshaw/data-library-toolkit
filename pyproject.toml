[project]
name = "data-library-toolkit"
version = "0.1.0"
description = "Catalog, convert and analyze a large pile of documents (rclone remotes / Zotero) as searchable markdown"
requires-python = ">=3.9"
dependencies = [
    "duckdb>=1.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=0.6",
    "openpyxl>=3.1",
    "pyzotero>=1.15",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
dlt = "dlt.cli:main"

[tool.setuptools]
packages = ["dlt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045"]  # keep typing.* spellings: Python 3.9 compatible
